# devices/garnet/device.conf: what this device repository is. tools/hakios-device.py reads it.
# Documentation: docs/porting/repositories.md

device garnet
	title       POCO X6 5G
	vendor      Xiaomi
	soc         sm7435
	defconfig   garnet_defconfig
	firmware    pull-firmware.sh
	maintainer  Montfort, Jotan (README.md)
	status      display     works     the panel through UEFI's framebuffer; frames drawn by Adreno 710 GPU with gpu=1
	status      touch       works     FocalTech FT3683G on QUP1 SE3 SPI, multitouch PV2 (CONFIG_HAKIOS_FOCALTECH, touchscreen=1)
	status      buttons     works     power and volume through PM6450 PMIC (CONFIG_HAKIOS_BUTTONS)
	status      cpu         works     all 8 cores, big core at 2.4 GHz (cpus=8 bootcpu=7 cpufreq=1)
	status      gpu         works     Adreno 710, OpenGL ES through Freedreno Mesa 25.0.7 (gpu=1); Metal in development
	status      storage     works     UFS read through the loader; /private/var with var_store=1 ufs_write=1
	status      audio       partial   dual AW88261 speaker amplifiers adapted; full audio DSP in progress
	status      battery     partial   battery reading through PMIC/DSP; charging under this kernel is not done
	status      haptic      partial   vibration motor adapted; full effects in progress
	status      camera      missing   in progress
	status      torch       missing   in progress
	status      wifi        missing   in progress
	status      bluetooth   missing   in progress
	status      cellular    missing   in progress
	status      thermal     partial   SoC thermal sensors monitored
